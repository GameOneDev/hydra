name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2022
            build-script: build:win
            python-version: "3.9"
            artifact-suffix: windows
          - os: windows-11-arm
            build-script: build:win-arm64
            python-version: "3.9"
            python-arch: x64
            artifact-suffix: windows-arm64
          - os: ubuntu-latest
            build-script: build:linux
            python-version: "3.9"
            artifact-suffix: linux
          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            build-script: build:mac
            python-version: "3.11"
            artifact-suffix: macos
          # macOS x64 (Intel)
          - os: macos-15-intel
            build-script: build:mac
            python-version: "3.11"
            artifact-suffix: macos-intel
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
          architecture: ${{ matrix.python-arch }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Python RPC with cx_Freeze
        run: python python_rpc/setup.py build

      - name: Build
        run: yarn ${{ matrix.build-script }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_STAGING_API_URL }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_STAGING_AUTH_URL }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_STAGING_CHECKOUT_URL }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RENDERER_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          RENDERER_VITE_REAL_DEBRID_REFERRAL_ID: ${{ vars.RENDERER_VITE_REAL_DEBRID_REFERRAL_ID }}
          RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}
          MAIN_VITE_LAUNCHER_SUBDOMAIN: ${{ vars.MAIN_VITE_LAUNCHER_SUBDOMAIN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
    
      - name: Rename builder debug file per platform
        shell: bash
        run: |
          if [[ -f dist/builder-debug.yml ]]; then
            cp dist/builder-debug.yml dist/builder-debug-${{ matrix.artifact-suffix }}.yml
          fi

      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-staging-${{ matrix.os }}
          path: |
            dist/*-portable*.exe
            dist/*-setup*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
            dist/*.AppImage

  build-production:
    if: github.event_name == 'push'

    strategy:
      matrix:
        include:
          - os: windows-2022
            build-script: build:win
            python-version: "3.9"
            artifact-suffix: windows
          - os: windows-11-arm
            build-script: build:win-arm64
            python-version: "3.9"
            python-arch: x64
            artifact-suffix: windows-arm64
          - os: ubuntu-latest
            build-script: build:linux
            python-version: "3.9"
            artifact-suffix: linux
          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            build-script: build:mac
            python-version: "3.11"
            artifact-suffix: macos
          # macOS x64 (Intel)
          - os: macos-15-intel
            build-script: build:mac
            python-version: "3.11"
            artifact-suffix: macos-intel
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
          architecture: ${{ matrix.python-arch }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Python RPC with cx_Freeze
        run: python python_rpc/setup.py build

      - name: Build
        run: yarn ${{ matrix.build-script }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RENDERER_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          RENDERER_VITE_REAL_DEBRID_REFERRAL_ID: ${{ vars.RENDERER_VITE_REAL_DEBRID_REFERRAL_ID }}
          RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}
          MAIN_VITE_LAUNCHER_SUBDOMAIN: ${{ vars.MAIN_VITE_LAUNCHER_SUBDOMAIN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Rename builder debug file per platform
        shell: bash
        run: |
          if [[ -f dist/builder-debug.yml ]]; then
            cp dist/builder-debug.yml dist/builder-debug-${{ matrix.artifact-suffix }}.yml
          fi

      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-production-${{ matrix.os }}
          path: |
            dist/*-portable*.exe
            dist/*-setup*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
            dist/*.AppImage
