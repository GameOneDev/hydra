name: Torrent bridge prebuilts

# Rebuilds the committed libtorrent bridge (native/torrent-bridge/prebuilt) on
# every platform and commits it to the branch the workflow runs on. It runs
# when a branch push changes the bridge inputs, or by hand; until it finishes,
# installs build the bridge from source. Checks on its own commit wait for a
# maintainer to approve them in the Actions tab.

on:
  push:
    branches-ignore:
      - main
      - "release/**"
    paths:
      - "native/torrent-bridge/**"
      - "!native/torrent-bridge/prebuilt/**"
      - "scripts/build-torrent-bridge.cjs"
      - ".github/workflows/torrent-bridge-prebuilt.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # MSVC output differs on every build, so rebuilding current bundles would
  # only commit new bytes. Manual runs always rebuild.
  status:
    runs-on: ubuntu-latest

    outputs:
      stale: ${{ github.event_name == 'workflow_dispatch' || steps.verify.outcome == 'failure' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify prebuilt bridges
        id: verify
        continue-on-error: true
        run: node scripts/torrent-bridge-prebuilt.cjs verify

  bridge:
    needs: status
    if: needs.status.outputs.stale == 'true'

    strategy:
      matrix:
        # One runner per bundle: windows-2022, ubuntu-latest and macos-15-intel
        # build x64; windows-11-arm and macos-latest build arm64.
        os:
          - windows-2022
          - windows-11-arm
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.21.0

      - name: Prepare native caches
        id: native-cache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "hydra-vcpkg-archives"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $platform = if ($env:RUNNER_OS -eq "Windows") { "windows-static" } else { "linux" }
          $image = "$env:ImageOS-$env:ImageVersion"
          "prefix=v1-vcpkg-$env:RUNNER_OS-$image-$arch-$arch-$platform" >> $env:GITHUB_OUTPUT

      # vcpkg checks each package ABI, including the compiler and build flags.
      # Keep fallback restores within the same runner image and target triplet.
      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.native-cache.outputs.prefix }}-${{ hashFiles('native/torrent-bridge/**/vcpkg*.json', 'native/torrent-bridge/**/triplets/**') }}
          restore-keys: |
            ${{ steps.native-cache.outputs.prefix }}-

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config curl zip unzip tar autoconf automake libtool

      # The windows-11-arm image now ships only Visual Studio 2026, which the
      # bridge's CMake and vcpkg setup cannot use yet. Install the VS 2022 C++
      # tools and pin the build to them, as the Build workflow does.
      - name: Install Visual Studio 2022 C++ build tools
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $components = @(
            "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
          )
          function Find-BuildTools {
            & $vswhere -products "*" -version "[17.0,18.0)" -requires $components -latest -property installationPath
          }
          $installPath = Find-BuildTools
          if (-not $installPath) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP "vs_buildtools.exe"
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile $bootstrapper
            $arguments = @(
              "--quiet", "--wait", "--norestart", "--nocache",
              "--add", "Microsoft.VisualStudio.Workload.VCTools",
              "--add", "Microsoft.VisualStudio.Component.Windows11SDK.26100"
            ) + ($components | ForEach-Object { "--add", $_ })
            $setup = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
            if ($setup.ExitCode -notin 0, 3010) {
              throw "Visual Studio 2022 Build Tools setup exited with code $($setup.ExitCode)"
            }
            $installPath = Find-BuildTools
          }
          if (-not $installPath) {
            throw "Visual Studio 2022 C++ build tools were not found after setup"
          }
          "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          "VCPKG_VISUAL_STUDIO_PATH=$installPath" >> $env:GITHUB_ENV

      # The checkout carries every platform's committed bundle; drop them so
      # this job's artifact holds only the one it builds.
      - name: Build torrent bridge
        shell: bash
        run: |
          rm -rf native/torrent-bridge/prebuilt
          node scripts/torrent-bridge-prebuilt.cjs update

      - name: Save vcpkg binary packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Upload prebuilt bridge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torrent-bridge-${{ matrix.os }}
          path: native/torrent-bridge/prebuilt/
          if-no-files-found: error

  commit:
    needs: bridge
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Replace every bundle, so files a new build no longer has go away too.
      - name: Remove old prebuilt bridges
        run: rm -rf native/torrent-bridge/prebuilt

      - name: Download prebuilt bridges
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: torrent-bridge-*
          merge-multiple: true
          path: native/torrent-bridge/prebuilt

      - name: Verify prebuilt bridges
        run: node scripts/torrent-bridge-prebuilt.cjs verify

      # Fails if the branch moved during the build; the new commits may have
      # changed the bridge, so run the workflow again.
      - name: Commit prebuilt bridges
        run: |
          git add -A native/torrent-bridge/prebuilt
          if git diff --cached --quiet; then
            echo "The prebuilt bridges are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(torrent-bridge): update prebuilt binaries" \
            -m "Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
