name: Release

env:
  RELEASE_ARTIFACT_RETENTION_DAYS: 7

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, must match package.json version (e.g. v4.0.5). Leave empty to only build, without creating a release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2022
            build-script: build:win
            artifact-suffix: windows
          - os: windows-11-arm
            build-script: build:win-arm64
            artifact-suffix: windows-arm64
          - os: ubuntu-latest
            build-script: build:linux
            artifact-suffix: linux
          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            build-script: build:mac
            artifact-suffix: macos
          # macOS x64 (Intel)
          - os: macos-15-intel
            build-script: build:mac
            artifact-suffix: macos-intel
      fail-fast: false

    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        if: inputs.tag != ''
        run: node -e "const v = 'v' + require('./package.json').version; const tag = '${{ inputs.tag }}'; if (tag !== v) { console.error('Tag ' + tag + ' does not match package.json version ' + v + '.'); process.exit(1); }"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare native caches
        id: native-cache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "hydra-vcpkg-archives"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $platform = if ($env:RUNNER_OS -eq "Windows") { "windows-static" } else { "linux" }
          $image = "$env:ImageOS-$env:ImageVersion"
          "image=$image" >> $env:GITHUB_OUTPUT
          "prefix=v1-vcpkg-$env:RUNNER_OS-$image-$arch-$arch-$platform" >> $env:GITHUB_OUTPUT

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/hydra-native -> target
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.image }}
          cache-bin: false

      # vcpkg checks each package ABI, including the compiler and build flags.
      # Keep fallback restores within the same runner image and target triplet.
      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.native-cache.outputs.prefix }}-${{ hashFiles('native/torrent-bridge/**/vcpkg*.json', 'native/torrent-bridge/**/triplets/**') }}
          restore-keys: |
            ${{ steps.native-cache.outputs.prefix }}-

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config curl zip unzip tar autoconf automake libtool

      # The windows-11-arm image now ships only Visual Studio 2026, which the
      # node-gyp used by yarn (11.x) and by @electron/rebuild (10.x) cannot
      # detect. Install the VS 2022 C++ tools and pin every native build to them.
      - name: Install Visual Studio 2022 C++ build tools
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $components = @(
            "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
          )
          function Find-BuildTools {
            & $vswhere -products "*" -version "[17.0,18.0)" -requires $components -latest -property installationPath
          }
          $installPath = Find-BuildTools
          if (-not $installPath) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP "vs_buildtools.exe"
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile $bootstrapper
            $arguments = @(
              "--quiet", "--wait", "--norestart", "--nocache",
              "--add", "Microsoft.VisualStudio.Workload.VCTools",
              "--add", "Microsoft.VisualStudio.Component.Windows11SDK.26100"
            ) + ($components | ForEach-Object { "--add", $_ })
            $setup = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
            if ($setup.ExitCode -notin 0, 3010) {
              throw "Visual Studio 2022 Build Tools setup exited with code $($setup.ExitCode)"
            }
            $installPath = Find-BuildTools
          }
          if (-not $installPath) {
            throw "Visual Studio 2022 C++ build tools were not found after setup"
          }
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          "VCPKG_VISUAL_STUDIO_PATH=$installPath" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: yarn --frozen-lockfile

      # Save before packaging so later failures do not discard compiled dependencies.
      - name: Save vcpkg binary packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: yarn ${{ matrix.build-script }}
        env:
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RENDERER_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          RENDERER_VITE_REAL_DEBRID_REFERRAL_ID: ${{ vars.RENDERER_VITE_REAL_DEBRID_REFERRAL_ID }}
          RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}
          MAIN_VITE_LAUNCHER_SUBDOMAIN: ${{ vars.MAIN_VITE_LAUNCHER_SUBDOMAIN }}
          # No Apple Developer certificate: skip codesign discovery
          # (electron-builder ad-hoc signs the app instead)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Rename builder debug file per platform
        shell: bash
        run: |
          if [[ -f dist/builder-debug.yml ]]; then
            cp dist/builder-debug.yml dist/builder-debug-${{ matrix.artifact-suffix }}.yml
          fi

      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.os }}
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          path: |
            dist/*-portable*.exe
            dist/*-setup*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
            !dist/builder-debug.yml

  release:
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install js-yaml
        run: npm install --no-save --ignore-scripts --engine-strict=false js-yaml

      - name: Collect release assets
        run: node scripts/collect-release-assets.cjs artifacts release-assets

      # Creates a draft release; the git tag is created automatically
      # when the draft is published, pointing at the commit built here
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
